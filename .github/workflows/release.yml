name: Release EUROFOAM

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: eurofoam-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag such as v1.0.0, got ${GITHUB_REF_NAME}"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "major=${MAJOR}" >> "${GITHUB_OUTPUT}"
          echo "minor=${MAJOR}.${MINOR}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/eurofoam-mattresses:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/eurofoam-mattresses:${{ steps.version.outputs.minor }}
            ${{ secrets.DOCKER_USERNAME }}/eurofoam-mattresses:${{ steps.version.outputs.major }}
            ${{ secrets.DOCKER_USERNAME }}/eurofoam-mattresses:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create deployment source bundle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          zip -r \
            "dist/eurofoam-mattresses-${{ steps.version.outputs.version }}.zip" \
            . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               ".next/*" \
               "data/*" \
               "dist/*" \
               ".env" \
               ".env.local" \
               ".env.production" \
               ".env.development"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            "dist/eurofoam-mattresses-${{ steps.version.outputs.version }}.zip#EUROFOAM deployment source bundle" \
            --title "EUROFOAM Mattresses ${{ steps.version.outputs.version }}" \
            --generate-notes
